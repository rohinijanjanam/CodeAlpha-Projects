<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Music Player</title>

    <!-- GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
        }

        /* BACKGROUND GLOW */

        .bg1,
        .bg2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            z-index: -1;
        }

        .bg1 {
            width: 300px;
            height: 300px;
            background: #ff00cc;
            top: 10%;
            left: 10%;
        }

        .bg2 {
            width: 350px;
            height: 350px;
            background: #00dbde;
            bottom: 10%;
            right: 10%;
        }

        /* PLAYER */

        .player {
            width: 380px;
            padding: 25px;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            color: white;
            text-align: center;
            position: relative;
        }

        /* ALBUM */

        .album {
            width: 240px;
            height: 240px;
            margin: auto;
            border-radius: 50%;
            overflow: hidden;
            border: 8px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            animation: rotate 10s linear infinite;
            animation-play-state: paused;
        }

        .album.play {
            animation-play-state: running;
        }

        .album img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* SONG INFO */

        h2 {
            margin-top: 20px;
            font-size: 26px;
            font-weight: 600;
        }

        h4 {
            color: #cfcfcf;
            margin-top: 5px;
            font-weight: 300;
        }

        /* PROGRESS */

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            margin: 25px 0 10px;
            cursor: pointer;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff00cc, #3333ff);
            border-radius: 20px;
        }

        .time {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #ddd;
        }

        /* CONTROLS */

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 25px;
            gap: 20px;
        }

        .controls button {
            border: none;
            outline: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .controls button:hover {
            transform: scale(1.15);
        }

        .small-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 20px;
        }

        .play-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff00cc, #3333ff);
            color: white;
            font-size: 28px;
            box-shadow: 0 5px 20px rgba(255, 0, 204, 0.4);
        }

        .extra-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 18px 0 10px;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #ddd;
        }

        .toggle-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 18px;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            display: grid;
            place-items: center;
        }

        .toggle-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.16);
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #ff00cc, #3333ff);
            border-color: transparent;
            box-shadow: 0 6px 18px rgba(255, 0, 204, 0.28);
        }

        .toggle-text {
            display: inline-block;
            color: #e8e8e8;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        /* VOLUME */

        .volume-container {
            margin-top: 25px;
            text-align: left;
        }

        .volume-container label {
            font-size: 14px;
            color: #eee;
        }

        .volume {
            width: 100%;
            margin-top: 10px;
            accent-color: #ff00cc;
        }

        /* PLAYLIST */

        .app {
            display: flex;
            gap: 22px;
            align-items: stretch;
            justify-content: center;
        }

        .side {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: stretch;
        }

        .left-box {
            width: 380px;
            padding: 25px;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .playlist-heading {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .left-albums {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .album-item {
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #eaeaea;
            font-size: 14px;
            display: flex;
            flex-direction: column;
        }

        .album-item strong {
            font-weight: 600;
            font-size: 14px;
            color: #fff;
        }

        .album-sub {
            margin-top: 4px;
            font-size: 12px;
            color: #cfcfcf;
            opacity: 0.9;
        }

        .playlist {
            flex: 1 1 auto;
            max-height: 140px;
            /* shorter */
            overflow: hidden;
            padding: 14px 18px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
        }

        .song-box {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        }

        .side-heading {
            font-size: 14px;
            color: #fff;
            text-align: center;
            font-weight: 600;
            margin-bottom: 10px;
            padding: 6px 8px;
            border-radius: 10px;
            background: linear-gradient(90deg, rgba(255, 0, 204, 0.10), rgba(51, 51, 255, 0.06));
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .playlist::-webkit-scrollbar {
            width: 5px;
        }

        .playlist::-webkit-scrollbar-thumb {
            background: #ff00cc;
            border-radius: 10px;
        }

        .song {
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            transition: 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .song:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .song.active {
            background: linear-gradient(135deg, #ff00cc, #3333ff);
        }

        .song span {
            font-size: 14px;
            color: #ddd;
        }

        /* MOBILE */

        @media(max-width:450px) {

            .player {
                width: 95%;
                padding: 20px;
            }

            .album {
                width: 200px;
                height: 200px;
            }

            h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="bg1"></div>
    <div class="bg2"></div>

    <div class="app">

        <div class="left-box">
            <div class="playlist-heading">Playlist</div>

            <div class="left-albums" id="leftAlbums">
                <div class="album-item"><strong>Neon Nights</strong>
                    <div class="album-sub">Various Artists</div>
                </div>
                <div class="album-item"><strong>Mood setter</strong>
                    <div class="album-sub">Curated mix</div>
                </div>
                <div class="album-item"><strong>Late Shift</strong>
                    <div class="album-sub">Synth Collective</div>
                </div>
                <div class="album-item"><strong>Quiet Waves</strong>
                    <div class="album-sub">LoFi Lounge</div>
                </div>
                <div class="album-item"><strong>Moonlight Drive</strong>
                    <div class="album-sub">Night Riders</div>
                </div>
                <div class="album-item"><strong>Solar Echoes</strong>
                    <div class="album-sub">Ambient Trails</div>
                </div>
                <div class="album-item"><strong>Retro Pulse</strong>
                    <div class="album-sub">Electro Mix</div>
                </div>
            </div>

        </div>

        <div class="player">

            <!-- ALBUM -->

            <div class="album" id="album">
                <img id="cover" src="">
            </div>

            <!-- SONG INFO -->

            <h2 id="title">Song Name</h2>
            <h4 id="artist">Artist</h4>

            <!-- PROGRESS -->

            <div class="progress-container" id="progress-container">
                <div class="progress" id="progress"></div>
            </div>

            <div class="time">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <!-- CONTROLS -->

            <div class="controls">
                <button class="small-btn" id="prev">⏮</button>
                <button class="play-btn" id="play">▶</button>
                <button class="small-btn" id="next">⏭</button>
            </div>

            <!-- VOLUME -->

            <div class="volume-container">
                <label>Volume</label>
                <input type="range" id="volume" class="volume" min="0" max="1" step="0.01" value="1">
            </div>

            <div class="extra-controls">
                <div class="toggle-item">
                    <button class="toggle-btn" id="shuffle">🔀</button>
                    <span class="toggle-text">Shuffle</span>
                </div>
                <div class="toggle-item">
                    <button class="toggle-btn" id="autoplay">🔁</button>
                    <span class="toggle-text">Autoplay</span>
                </div>
            </div>

        </div>

        <!-- side song box beside player -->
        <div class="side">
            <div class="song-box" id="songbox">
                <div class="side-heading">Mood setter</div>
                <!-- songs inserted below -->
            </div>
        </div>

    </div> <!-- .app -->

    <script>

        // SONGS

        const moodSetterSongs = [

            {
                title: "Night Drive",
                artist: "Synthwave",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                cover: "https://picsum.photos/id/237/500/500"
            },

            {
                title: "Dream Escape",
                artist: "Chill Beats",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                cover: "https://picsum.photos/id/238/500/500"
            },

            {
                title: "Ocean Lights",
                artist: "LoFi Studio",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                cover: "https://picsum.photos/id/239/500/500"
            },

            {
                title: "Midnight Drive",
                artist: "Synthwave Vibes",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
                cover: "https://picsum.photos/id/240/500/500"
            },

            {
                title: "Starlit Breeze",
                artist: "Dreamwave",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",
                cover: "https://picsum.photos/id/241/500/500"
            },

            {
                title: "Aurora Nights",
                artist: "Chill Pilots",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3",
                cover: "https://picsum.photos/id/242/500/500"
            }

        ];

        const neonNightsSongs = [
            { title: "Electric Pulse", artist: "Neon Wave", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3", cover: "https://picsum.photos/id/243/500/500" },
            { title: "Glow City", artist: "Neon Lights", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3", cover: "https://picsum.photos/id/244/500/500" },
            { title: "Neon Dreams", artist: "Cyber Synth", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3", cover: "https://picsum.photos/id/245/500/500" },
            { title: "Bright Horizon", artist: "Neon Vibes", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3", cover: "https://picsum.photos/id/246/500/500" }
        ];

        const lateShiftSongs = [
            { title: "Late Night Flow", artist: "After Hours", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-11.mp3", cover: "https://picsum.photos/id/247/500/500" },
            { title: "Midnight Groove", artist: "Night Owls", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-12.mp3", cover: "https://picsum.photos/id/248/500/500" },
            { title: "Dark Hours", artist: "Shift Workers", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-13.mp3", cover: "https://picsum.photos/id/249/500/500" },
            { title: "Graveyard Shift", artist: "Night Shift", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-14.mp3", cover: "https://picsum.photos/id/250/500/500" }
        ];

        const quietWavesSongs = [
            { title: "Gentle Waves", artist: "Ocean Calm", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3", cover: "https://picsum.photos/id/251/500/500" },
            { title: "Silent Sea", artist: "Water Sounds", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-16.mp3", cover: "https://picsum.photos/id/252/500/500" },
            { title: "Peaceful Tide", artist: "Coastal Vibes", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-17.mp3", cover: "https://picsum.photos/id/253/500/500" },
            { title: "Zen Waves", artist: "Tranquility", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-18.mp3", cover: "https://picsum.photos/id/254/500/500" }
        ];

        const moonlightDriveSongs = [
            { title: "Moonlit Road", artist: "Night Cruiser", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-19.mp3", cover: "https://picsum.photos/id/255/500/500" },
            { title: "Silver Highway", artist: "Lunar Traveler", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-20.mp3", cover: "https://picsum.photos/id/256/500/500" },
            { title: "Night Journey", artist: "Moon Rider", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-21.mp3", cover: "https://picsum.photos/id/257/500/500" },
            { title: "Starry Drive", artist: "Cosmic Driver", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-22.mp3", cover: "https://picsum.photos/id/258/500/500" }
        ];

        const solarEchoesSongs = [
            { title: "Solar Flare", artist: "Sun Rays", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-23.mp3", cover: "https://picsum.photos/id/259/500/500" },
            { title: "Sunburst", artist: "Cosmic Echo", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-24.mp3", cover: "https://picsum.photos/id/260/500/500" },
            { title: "Solar Wind", artist: "Space Ambient", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-25.mp3", cover: "https://picsum.photos/id/261/500/500" },
            { title: "Radiant Energy", artist: "Solar Vibes", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-26.mp3", cover: "https://picsum.photos/id/262/500/500" }
        ];

        const retroPulseSongs = [
            { title: "Retro Synth", artist: "80s Echo", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-27.mp3", cover: "https://picsum.photos/id/263/500/500" },
            { title: "Vintage Beat", artist: "Nostalgia", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-28.mp3", cover: "https://picsum.photos/id/264/500/500" },
            { title: "Pulse of the Past", artist: "Retro Wave", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-29.mp3", cover: "https://picsum.photos/id/265/500/500" },
            { title: "Old School Groove", artist: "Classic Vibes", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-30.mp3", cover: "https://picsum.photos/id/266/500/500" }
        ];

        const songs = moodSetterSongs;

        // ELEMENTS

        const audio = new Audio();

        const title = document.getElementById("title");
        const artist = document.getElementById("artist");
        const cover = document.getElementById("cover");

        const playBtn = document.getElementById("play");
        const prevBtn = document.getElementById("prev");
        const nextBtn = document.getElementById("next");

        const progress = document.getElementById("progress");
        const progressContainer = document.getElementById("progress-container");

        const currentTimeEl = document.getElementById("current-time");
        const durationEl = document.getElementById("duration");

        const volume = document.getElementById("volume");

        const songbox = document.getElementById("songbox");
        const leftAlbumsEl = document.getElementById("leftAlbums");

        const shuffleBtn = document.getElementById("shuffle");
        const autoplayBtn = document.getElementById("autoplay");
        const album = document.getElementById("album");

        let currentSong = 0;
        let isPlaying = false;
        let isShuffle = false;
        let isAutoplay = false;
        // Albums map with all albums and their songs
        const albums = {
            "Mood setter": moodSetterSongs,
            "Neon Nights": neonNightsSongs,
            "Late Shift": lateShiftSongs,
            "Quiet Waves": quietWavesSongs,
            "Moonlight Drive": moonlightDriveSongs,
            "Solar Echoes": solarEchoesSongs,
            "Retro Pulse": retroPulseSongs
        };

        let currentPlaylist = albums["Mood setter"] || moodSetterSongs;

        // LOAD SONG

        function loadSong(index) {

            const song = currentPlaylist[index];

            title.textContent = song.title;
            artist.textContent = song.artist;
            cover.src = song.cover;

            audio.src = song.src;

            updatePlaylist();
        }

        // PLAY

        function playSong() {

            audio.play();

            isPlaying = true;

            playBtn.textContent = "❚❚";

            album.classList.add("play");
        }

        // PAUSE

        function pauseSong() {

            audio.pause();

            isPlaying = false;

            playBtn.textContent = "▶";

            album.classList.remove("play");
        }

        // PLAY BUTTON

        playBtn.addEventListener("click", () => {

            if (isPlaying) {
                pauseSong();
            } else {
                playSong();
            }

        });

        // NEXT SONG

        function nextSong() {
            if (isShuffle) {
                let nextIndex = currentSong;
                while (nextIndex === currentSong && currentPlaylist.length > 1) {
                    nextIndex = Math.floor(Math.random() * currentPlaylist.length);
                }
                currentSong = nextIndex;
            } else {
                currentSong = (currentSong + 1) % currentPlaylist.length;
            }

            loadSong(currentSong);
            playSong();
        }

        // PREV SONG

        function prevSong() {

            currentSong = (currentSong - 1 + currentPlaylist.length) % currentPlaylist.length;

            loadSong(currentSong);

            playSong();
        }

        nextBtn.addEventListener("click", nextSong);
        prevBtn.addEventListener("click", prevSong);

        shuffleBtn.addEventListener("click", () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle("active", isShuffle);
        });

        autoplayBtn.addEventListener("click", () => {
            isAutoplay = !isAutoplay;
            autoplayBtn.classList.toggle("active", isAutoplay);
        });

        // UPDATE PROGRESS

        audio.addEventListener("timeupdate", () => {

            const { duration, currentTime } = audio;

            const percent = (currentTime / duration) * 100;

            progress.style.width = `${percent}%`;

            function formatTime(time) {

                const mins = Math.floor(time / 60);

                const secs = Math.floor(time % 60)
                    .toString()
                    .padStart(2, "0");

                return `${mins}:${secs}`;
            }

            currentTimeEl.textContent = formatTime(currentTime);

            if (duration) {
                durationEl.textContent = formatTime(duration);
            }

        });

        // SEEK

        progressContainer.addEventListener("click", (e) => {

            const width = progressContainer.clientWidth;

            const clickX = e.offsetX;

            audio.currentTime = (clickX / width) * audio.duration;

        });

        // VOLUME

        volume.addEventListener("input", () => {

            audio.volume = volume.value;

        });

        // AUTOPLAY

        audio.addEventListener("ended", () => {
            if (isAutoplay) {
                nextSong();
            } else {
                pauseSong();
            }
        });

        // PLAYLIST

        function createPlaylist(playlist, albumName) {
            // render given playlist into songbox; albumName sets the side heading
            songbox.innerHTML = `<div class="side-heading">${albumName}</div>`;

            playlist.forEach((song, index) => {

                const div = document.createElement("div");

                div.classList.add("song");

                div.innerHTML = `
                    <div>
                        <strong>${song.title}</strong><br>
                        <span>${song.artist}</span>
                    </div>
                    <span>▶</span>
                `;

                div.addEventListener("click", () => {

                    currentSong = index;

                    loadSong(currentSong);

                    playSong();

                });

                songbox.appendChild(div);

            });

        }

        // UPDATE ACTIVE SONG

        function updatePlaylist() {

            const items = document.querySelectorAll(".song");

            items.forEach((item, index) => {

                item.classList.remove("active");

                if (index === currentSong) {
                    item.classList.add("active");
                }

            });

        }

        // LEFT ALBUM CLICK HANDLERS
        const albumEls = document.querySelectorAll('#leftAlbums .album-item');
        albumEls.forEach(el => {
            el.style.cursor = 'pointer';
            el.addEventListener('click', () => {
                const albumName = el.querySelector('strong')?.textContent || el.textContent.trim();
                const list = albums[albumName] || [];
                if (list.length === 0) return;
                currentPlaylist = list;
                currentSong = 0;
                createPlaylist(currentPlaylist, albumName);
                loadSong(0);
                playSong();
            });
        });

        // KEYBOARD SUPPORT

        document.addEventListener("keydown", (e) => {

            if (e.code === "Space") {

                e.preventDefault();

                if (isPlaying) {
                    pauseSong();
                } else {
                    playSong();
                }

            }

            if (e.code === "ArrowRight") {
                nextSong();
            }

            if (e.code === "ArrowLeft") {
                prevSong();
            }

        });

        // INIT

        // Render default album (Mood setter)
        createPlaylist(currentPlaylist, 'Mood setter');

        loadSong(currentSong);

    </script>

</body>

</html>
